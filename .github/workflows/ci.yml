name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: easyryde_test
          POSTGRES_USER: easyryde
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pgsql, bcmath, gd, exif, pcov, redis
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        working-directory: backend
        run: |
          cp .env.testing .env
          php artisan key:generate

      - name: Run migrations
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: easyryde_test
          DB_USERNAME: easyryde
          DB_PASSWORD: devpassword
        run: php artisan migrate --force

      - name: Run PHPUnit tests
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: easyryde_test
          DB_USERNAME: easyryde
          DB_PASSWORD: devpassword
        run: php vendor/bin/phpunit --configuration phpunit.xml --coverage-text

  mobile-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: TypeScript check (shared)
        working-directory: mobile/packages/shared
        run: npx tsc --noEmit

      - name: TypeScript check (rider)
        working-directory: mobile/apps/rider
        run: npx tsc --noEmit

      - name: TypeScript check (driver)
        working-directory: mobile/apps/driver
        run: npx tsc --noEmit

      - name: TypeScript check (admin)
        working-directory: mobile/apps/admin
        run: npx tsc --noEmit

      - name: Jest tests (shared)
        working-directory: mobile/packages/shared
        run: npx jest --ci --reporters=default --reporters=github-actions

      - name: Jest tests (rider)
        working-directory: mobile/apps/rider
        run: npx jest --ci --reporters=default --reporters=github-actions

      - name: Jest tests (driver)
        working-directory: mobile/apps/driver
        run: npx jest --ci --reporters=default --reporters=github-actions

      - name: Jest tests (admin)
        working-directory: mobile/apps/admin
        run: npx jest --ci --reporters=default --reporters=github-actions

  web-typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript check
        working-directory: web
        run: npx tsc --noEmit

  socket-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'socket-server/package-lock.json'

      - name: Install dependencies
        working-directory: socket-server
        run: npm ci

      - name: Run tests
        working-directory: socket-server
        run: npm test

  eslint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: ESLint (mobile)
        working-directory: mobile
        run: npx eslint .

      - name: ESLint (web)
        working-directory: web
        run: npx eslint .

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Image
        run: docker build -f .docker/php/Dockerfile -t easyryde-backend ./backend
      - name: Build Socket Server Image
        run: docker build -f socket-server/Dockerfile -t easyryde-socket ./socket-server