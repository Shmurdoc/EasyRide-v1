name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, exif, pcov
          coverage: pcov
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - name: Install Dependencies
        working-directory: backend
        run: composer install --no-progress --prefer-dist
      - name: Prepare Environment
        working-directory: backend
        run: |
          cp .env.testing .env
          php -n artisan key:generate
      - name: Run Tests
        working-directory: backend
        run: php -n vendor/bin/phpunit --configuration phpunit.xml --coverage-text

  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        working-directory: mobile
        run: npm ci
      - name: TypeScript Check (Rider)
        working-directory: mobile/apps/rider
        run: npx tsc --noEmit
      - name: TypeScript Check (Driver)
        working-directory: mobile/apps/driver
        run: npx tsc --noEmit

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Image
        run: docker build -f .docker/php/Dockerfile -t easyryde-backend ./backend
      - name: Build Socket Server Image
        run: docker build -f socket-server/Dockerfile -t easyryde-socket ./socket-server
