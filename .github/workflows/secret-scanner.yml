# ============================================================
# EasyRyde CI Secret Scanner
# ============================================================
# Add this to your GitHub Actions workflow to prevent
# committing real secrets to the repository.
# ============================================================

name: Secret Scanner

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for scanning

      - name: Detect hardcoded secrets
        run: |
          echo "🔍 Scanning for secrets in codebase..."

          FOUND=0

          # Pattern: APP_KEY with base64 value
          if grep -rnP 'APP_KEY=base64:[A-Za-z0-9+/=]{20,}' \
            --include="*.env" --include="*.env.*" \
            --exclude="*.example" --exclude="*.secure.example" \
            .; then
            echo "❌ Found real APP_KEY!"
            FOUND=1
          fi

          # Pattern: JWT_SECRET with real value (not placeholder)
          if grep -rnP 'JWT_SECRET=[A-Za-z0-9]{32,}' \
            --include="*.env" --include="*.env.*" \
            --exclude="*.example" --exclude="*.secure.example" \
            .; then
            echo "❌ Found real JWT_SECRET!"
            FOUND=1
          fi

          # Pattern: Stripe live keys
          if grep -rnP 'STRIPE_SECRET_KEY=sk_live_' \
            --include="*.env" --include="*.env.*" \
            --exclude="*.example" --exclude="*.secure.example" \
            .; then
            echo "❌ Found live Stripe key!"
            FOUND=1
          fi

          # Pattern: Real Google Maps keys (not empty)
          if grep -rnP 'EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=AIza[A-Za-z0-9_-]{20,}' \
            --include="*.env" --include="*.env.*" \
            --exclude="*.example" --exclude="*.secure.example" \
            .; then
            echo "❌ Found real Google Maps API key!"
            FOUND=1
          fi

          # Pattern: AWS secret access keys
          if grep -rnP 'AWS_SECRET_ACCESS_KEY=[A-Za-z0-9]{20,}' \
            --include="*.env" --include="*.env.*" \
            --exclude="*.example" --exclude="*.secure.example" \
            .; then
            echo "❌ Found real AWS secret key!"
            FOUND=1
          fi

          # Pattern: Twilio auth tokens
          if grep -rnP 'TWILIO_AUTH_TOKEN=[A-Za-z0-9]{20,}' \
            --include="*.env" --include="*.env.*" \
            --exclude="*.example" --exclude="*.secure.example" \
            .; then
            echo "❌ Found real Twilio auth token!"
            FOUND=1
          fi

          if [ $FOUND -eq 1 ]; then
            echo ""
            echo "🛑 Secrets detected! Do NOT merge this PR."
            echo "   Replace real values with CHANGE_ME placeholders."
            echo "   Use local .env files (gitignored) for real secrets."
            exit 1
          fi

          echo "✅ No real secrets found."

      - name: Scan git history for leaked secrets
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Scanning PR diff for secrets..."

          # Check added lines for secrets
          git diff origin/${{ github.base_ref }}...HEAD -U0 | \
            grep -P '^\+.*(APP_KEY=base64:|JWT_SECRET=[A-Za-z0-9]{32,}|sk_live_|sk_test_)' && {
              echo "❌ Secret-like value found in PR diff!"
              exit 1
          } || echo "✅ PR diff is clean."
