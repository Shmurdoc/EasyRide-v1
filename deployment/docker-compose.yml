services:
  # ── Nginx (reverse proxy) ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: easyryde-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/easyryde.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/admin.conf:/etc/nginx/conf.d/admin.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/letsencrypt:/var/www/letsencrypt
      - backend-storage:/var/www/storage
      - admin-dist:/var/www/admin:ro
    depends_on:
      - laravel
      - socket
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Laravel API (PHP-FPM) ──────────────────────────────────────
  laravel:
    build:
      context: ../backend
      dockerfile: ../deployment/Dockerfile.laravel
    container_name: easyryde-laravel
    restart: unless-stopped
    volumes:
      - backend-storage:/var/www/html/storage
      - backend-bootstrap:/var/www/html/bootstrap/cache
    networks:
      - backend
    env_file: .env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Socket.IO (Node.js) ───────────────────────────────────────
  socket:
    build:
      context: ../socket-server
      dockerfile: ../deployment/Dockerfile.socket
    container_name: easyryde-socket
    restart: unless-stopped
    networks:
      - frontend
      - backend
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── PostgreSQL + PostGIS ──────────────────────────────────────
  database:
    image: postgis/postgis:16-3.4-alpine
    container_name: easyryde-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-easyryde}
      POSTGRES_USER: ${DB_USERNAME:-easyryde}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-easyryde} -d ${DB_DATABASE:-easyryde}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: easyryde-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Queue Worker (Horizon) ────────────────────────────────────
  queue:
    build:
      context: ../backend
      dockerfile: ../deployment/Dockerfile.laravel
    container_name: easyryde-queue
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - backend-storage:/var/www/html/storage
      - backend-bootstrap:/var/www/html/bootstrap/cache
    networks:
      - backend
    env_file: .env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Scheduler ─────────────────────────────────────────────────
  scheduler:
    build:
      context: ../backend
      dockerfile: ../deployment/Dockerfile.laravel
    container_name: easyryde-scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - backend-storage:/var/www/html/storage
      - backend-bootstrap:/var/www/html/bootstrap/cache
    networks:
      - backend
    env_file: .env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Admin Dashboard ───────────────────────────────────────────
  admin:
    build:
      context: ../admin
      dockerfile: ../deployment/Dockerfile.admin
    container_name: easyryde-admin
    restart: unless-stopped
    volumes:
      - admin-dist:/usr/share/nginx/html:ro
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 64M

# ── Volumes ───────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  backend-storage:
    driver: local
  backend-bootstrap:
    driver: local
  admin-dist:
    driver: local

# ── Networks ──────────────────────────────────────────────────────
networks:
  frontend:
    driver: bridge
    name: easyryde_frontend
  backend:
    driver: bridge
    internal: true
    name: easyryde_backend
