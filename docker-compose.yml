services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: easyryde-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./backend/.env
    volumes:
      - backend-storage:/var/www/storage
      - backend-logs:/var/www/storage/logs
    networks:
      - easyryde

  nginx:
    image: nginx:alpine
    container_name: easyryde-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "90:80"
      - "9443:443"
      - "3082:8080"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - backend-storage:/var/www/storage
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - easyryde

  database:
    image: postgres:16-alpine
    container_name: easyryde-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-easyryde}
      POSTGRES_USER: ${DB_USERNAME:-easyryde}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-easyryde} -d ${DB_DATABASE:-easyryde}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - easyryde

  redis:
    image: redis:7-alpine
    container_name: easyryde-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - easyryde

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: easyryde-queue
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./backend/.env
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - backend-storage:/var/www/storage
    networks:
      - easyryde

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: easyryde-scheduler
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./backend/.env
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - backend-storage:/var/www/storage
    networks:
      - easyryde

volumes:
  postgres-data:
  redis-data:
  backend-storage:
  backend-logs:

networks:
  easyryde:
    driver: bridge
