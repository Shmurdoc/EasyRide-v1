openapi: 3.0.3
info:
  title: EasyRyde API
  description: |
    Ride-hailing and food delivery platform API for Phalaborwa, South Africa.
    Supports ride booking, food delivery, driver management, payments (wallet, PayFast, Ozow, Stripe), and admin operations.
  version: 1.0.0
  contact:
    name: EasyRyde Support
    email: support@easyryde.co.za
  license:
    name: Proprietary

servers:
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://api.easyryde.co.za/api/v1
    description: Production

tags:
  - name: Health
    description: System health checks
  - name: Config
    description: Application configuration
  - name: Auth
    description: Authentication and registration
  - name: Social Auth
    description: OAuth social authentication
  - name: Users
    description: User profile management
  - name: Rides
    description: Ride booking and management
  - name: Drivers
    description: Driver-specific operations
  - name: Payments
    description: Payment processing and refunds
  - name: Wallet
    description: Digital wallet operations
  - name: Ratings
    description: Ride and driver ratings
  - name: Promo Codes
    description: Promotional code management
  - name: Deliveries
    description: General delivery management
  - name: Food Delivery
    description: Restaurant orders and food delivery
  - name: Notifications
    description: Push and in-app notifications
  - name: Notification Preferences
    description: User notification settings
  - name: Scheduled Rides
    description: Scheduled ride booking
  - name: Referrals
    description: Referral program
  - name: SOS
    description: Safety and emergency alerts
  - name: Chat
    description: Ride chat messages
  - name: Pool Rides
    description: Shared/pool ride features
  - name: Consent
    description: POPIA consent management
  - name: KYC
    description: Know Your Customer verification
  - name: Incidents
    description: Incident reporting
  - name: Data Rights
    description: POPIA data rights (export, anonymize, erase)
  - name: Admin Dashboard
    description: Admin dashboard and analytics
  - name: Admin Reports
    description: Admin reporting and exports
  - name: Admin TOTP
    description: Admin TOTP two-factor authentication
  - name: Admin Core
    description: Core admin operations
  - name: Admin Live Map
    description: Real-time driver tracking
  - name: Admin Food
    description: Restaurant and food order management
  - name: Admin Payouts
    description: Driver payout management
  - name: Admin Notifications
    description: Admin notification broadcasting
  - name: Admin Peak Hours
    description: Peak hour surge pricing rules
  - name: Admin Surge Zones
    description: Surge zone management
  - name: Admin KYC
    description: KYC compliance review
  - name: Admin Incidents
    description: Incident management
  - name: Admin Data Retention
    description: Data retention and cleanup
  - name: Admin User Management
    description: User account administration
  - name: Admin Driver Management
    description: Driver account administration
  - name: Admin Ride Management
    description: Ride administration
  - name: Admin Payment Management
    description: Payment administration
  - name: Admin Wallet Management
    description: Wallet and payout administration
  - name: Admin KYC Management
    description: KYC document management
  - name: Inspector
    description: System inspector and diagnostics
  - name: Webhooks
    description: External webhook receivers

paths:
  # ─── HEALTH ────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      operationId: health_check
      summary: System health check
      security: []
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── CONFIG ────────────────────────────────────────────────────
  /config:
    get:
      tags: [Config]
      operationId: get_config
      summary: Get public application configuration
      security: []
      responses:
        '200':
          description: Application configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      app_name:
                        type: string
                      currency:
                        type: string
                      country:
                        type: string
                      payment_methods:
                        type: array
                        items:
                          type: string
                      google_maps_key:
                        type: string
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── AUTH ──────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      operationId: auth_register
      summary: Register a new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Too many registration attempts
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags: [Auth]
      operationId: auth_login
      summary: Authenticate and receive tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Too many login attempts
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: auth_forgot_password
      summary: Request a password reset link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset link sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: auth_reset_password
      summary: Reset password using token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: auth_logout
      summary: Revoke current access token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/me:
    get:
      tags: [Auth]
      operationId: auth_me
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── SOCIAL AUTH ──────────────────────────────────────────────
  /auth/{provider}/redirect:
    get:
      tags: [Social Auth]
      operationId: social_redirect
      summary: Redirect to OAuth provider
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, facebook, apple]
      responses:
        '302':
          description: Redirect to OAuth provider
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/{provider}/callback:
    get:
      tags: [Social Auth]
      operationId: social_callback
      summary: Handle OAuth callback
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, facebook, apple]
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OAuth login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── USERS ────────────────────────────────────────────────────
  /users:
    get:
      tags: [Users]
      operationId: user_index
      summary: List all users
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{user}:
    get:
      tags: [Users]
      operationId: user_show
      summary: Get user by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserPath'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Users]
      operationId: user_update
      summary: Update user profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Users]
      operationId: user_destroy
      summary: Delete user account
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserPath'
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── PLACES ───────────────────────────────────────────────────
  /places/search:
    get:
      tags: [Rides]
      operationId: places_search
      summary: Search for places (autocomplete)
      security: []
      parameters:
        - name: input
          in: query
          required: true
          schema:
            type: string
          description: Search query string
        - name: location
          in: query
          schema:
            type: string
          description: Bias location as lat,lng
      responses:
        '200':
          description: Place search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        place_id:
                          type: string
                        description:
                          type: string
                        lat:
                          type: number
                          format: double
                        lng:
                          type: number
                          format: double
        '500':
          $ref: '#/components/responses/InternalServerError'

  /places/reverse:
    get:
      tags: [Rides]
      operationId: places_reverse
      summary: Reverse geocode coordinates to address
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
      responses:
        '200':
          description: Reverse geocode result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      address:
                        type: string
                      lat:
                        type: number
                      lng:
                        type: string
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── RIDES ────────────────────────────────────────────────────
  /rides/fare-estimate:
    get:
      tags: [Rides]
      operationId: ride_fare_estimate
      summary: Get estimated fare for a route
      security: []
      parameters:
        - name: pickup_lat
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: pickup_lng
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: dropoff_lat
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: dropoff_lng
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: ride_type
          in: query
          schema:
            type: string
            enum: [economy, comfort, premium]
      responses:
        '200':
          description: Fare estimate
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      fare_estimate:
                        type: number
                        format: double
                      currency:
                        type: string
                      distance_km:
                        type: number
                        format: double
                      duration_minutes:
                        type: integer
                      surge_multiplier:
                        type: number
                        format: double
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rides:
    get:
      tags: [Rides]
      operationId: ride_index
      summary: List rides for current user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, in_progress, completed, cancelled]
      responses:
        '200':
          description: Paginated rides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRideResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Rides]
      operationId: ride_store
      summary: Request a new ride
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup_lat, pickup_lng, dropoff_lat, dropoff_lng]
              properties:
                pickup_lat:
                  type: number
                  format: double
                pickup_lng:
                  type: number
                  format: double
                dropoff_lat:
                  type: number
                  format: double
                dropoff_lng:
                  type: number
                  format: double
                pickup_address:
                  type: string
                dropoff_address:
                  type: string
                ride_type:
                  type: string
                  enum: [economy, comfort, premium]
                  default: economy
                payment_method:
                  type: string
                  enum: [cash, wallet, payfast, ozow, stripe]
                scheduled_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Set for scheduled rides
      responses:
        '201':
          description: Ride requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rides/current:
    get:
      tags: [Rides]
      operationId: ride_current
      summary: Get current active ride
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current ride or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ride'
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rides/{ride}:
    get:
      tags: [Rides]
      operationId: ride_show
      summary: Get ride details
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RidePath'
      responses:
        '200':
          description: Ride details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rides/{ride}/cancel:
    post:
      tags: [Rides]
      operationId: ride_cancel
      summary: Cancel a ride
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RidePath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Ride cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rides/{ride}/rate:
    post:
      tags: [Rides]
      operationId: ride_rate
      summary: Rate a completed ride
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RidePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '200':
          description: Rating submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rides/{ride}/apply-promo:
    post:
      tags: [Rides]
      operationId: ride_apply_promo
      summary: Apply a promo code to a ride
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RidePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [promo_code]
              properties:
                promo_code:
                  type: string
      responses:
        '200':
          description: Promo applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rides/{ride}/no-show:
    post:
      tags: [Rides]
      operationId: ride_mark_no_show
      summary: Mark rider as no-show
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RidePath'
      responses:
        '200':
          description: No-show marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rides/{ride}/driver-accept:
    post:
      tags: [Rides, Drivers]
      operationId: ride_driver_accept
      summary: Driver accepts a ride request
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RidePath'
      responses:
        '200':
          description: Ride accepted by driver
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rides/{ride}/driver-arrived:
    post:
      tags: [Rides, Drivers]
      operationId: ride_driver_arrived
      summary: Driver arrived at pickup location
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RidePath'
      responses:
        '200':
          description: Driver arrival recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rides/{ride}/start:
    post:
      tags: [Rides, Drivers]
      operationId: ride_start
      summary: Start a ride
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RidePath'
      responses:
        '200':
          description: Ride started
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rides/{ride}/complete:
    post:
      tags: [Rides, Drivers]
      operationId: ride_complete
      summary: Complete a ride
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RidePath'
      responses:
        '200':
          description: Ride completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rides/{ride}/location:
    post:
      tags: [Rides]
      operationId: ride_update_location
      summary: Update driver location during ride
      security:
        - bearerAuth: []
      parameters:
